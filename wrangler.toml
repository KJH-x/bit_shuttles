name = "bit-shuttles"
compatibility_date = "2026-08-27"
pages_build_output_dir = "."

# 余票实时查询配置（生产环境变量，secret 不放这里）
# 说明：TTL 窗口 / 可见窗口 / 余票颜色阈值等常量以代码为唯一事实来源
# （functions/_shared/ttl.js、lib/availability.js），此处不再声明，避免死配置与数值漂移。
[vars]
ENABLE_XISHAN = "false"

# R2 绑定：历史快照 / 客流对比 / last-failed 日志
[[r2_buckets]]
binding = "AVAIL_BUCKET"
bucket_name = "campus-shuttle-avail"
