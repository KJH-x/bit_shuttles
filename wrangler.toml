name = "bit-shuttles"
compatibility_date = "2026-08-27"
pages_build_output_dir = "."

# 余票实时查询配置（生产环境变量，secret 不放这里）
[vars]
VISIBLE_WINDOW_MIN = 180
PAID_PRESALE_MIN = 60
PAID_STOP_MIN = 5
AVAIL_THRESHOLD_GREEN = 15
AVAIL_THRESHOLD_YELLOW = 10
AVAIL_THRESHOLD_RED = 5
ENABLE_XISHAN = "false"

# R2 绑定：历史快照 / 客流对比 / last-failed 日志
[[r2_buckets]]
binding = "AVAIL_BUCKET"
bucket_name = "campus-shuttle-avail"
